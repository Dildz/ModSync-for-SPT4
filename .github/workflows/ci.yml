# CI pipeline — runs on every push to a supported-version branch and on PRs targeting one.
# Builds the solution and runs both test suites. No artifacts, no release.
#
# Uses a Windows runner to match the release pipeline (client targets net472).

name: CI

on:
  push:
    branches: ['SPT4.0.x', 'SPT4.1.x']
  pull_request:
    branches: ['SPT4.0.x', 'SPT4.1.x']

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SPT 4.1 targets .NET 10, so ModSync.Server + ModSync.Server.Tests are net10.0.
      # ModSync.Tests / Updater / HashTester are still net9.0, and running a net9 test needs
      # the net9 runtime, which the .NET 10 SDK does not include — so install both.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run client tests
        run: dotnet test ModSync.Tests/ModSync.Tests.csproj -c Release --no-build --nologo

      - name: Run server tests
        run: dotnet test ModSync.Server.Tests/ModSync.Server.Tests.csproj -c Release --no-build --nologo
