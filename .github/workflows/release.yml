# Release pipeline — triggered when a git tag matching `v*` is pushed.
#
# Tag a commit (e.g. `git tag v0.11.1-pre1 && git push --tags`) and GitHub Actions
# will: build the whole solution, run the unit tests, stage the binaries into the
# layout users extract into their SPT install, zip them up, and publish a GitHub
# Release with the zip attached. Tags containing `-pre` are marked as pre-releases.
#
# Naming convention: `v<major>.<minor>.<patch>` for stable, `v<...>-pre<N>` /
# `v<...>-rc<N>` for unstable. Example: `v0.11.1-pre1`.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required for softprops/action-gh-release to publish

jobs:
  release:
    runs-on: windows-latest
    # Windows runner because the client (ModSync) targets .NET Framework 4.7.2.
    # Linux *can* build net472 via the Microsoft.NETFramework.ReferenceAssemblies
    # package, but Windows is friction-free and aligns with how Dildz builds locally.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SPT 4.1 targets .NET 10; every project in the solution is net10.0 now.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        # Reads nuget.config (which includes the BepInEx feed) and fetches every
        # PackageReference across all projects. Cached automatically by setup-dotnet.
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Run client tests
        # Targets the Tests project directly so we don't try to "test" non-test
        # projects (which would no-op but emits warnings). --no-build is safe
        # because the prior step already produced the test binaries.
        run: dotnet test ModSync.Tests/ModSync.Tests.csproj -c Release --no-build --nologo

      - name: Run server tests
        run: dotnet test ModSync.Server.Tests/ModSync.Server.Tests.csproj -c Release --no-build --nologo

      - name: Publish Updater as single file
        # The Updater's csproj has `PublishSingleFile=true`, but that only kicks in
        # for `dotnet publish` (not `dotnet build`). Without this step the zip would
        # contain 5 separate Updater files (.exe + .dll + .deps.json + .runtimeconfig.json
        # + Newtonsoft.Json.dll). Publishing bundles them all into one ~1.6MB .exe.
        #
        # `--no-self-contained` keeps it framework-dependent, avoiding ~60MB of bundled
        # runtime bloat — which matters here because ModSync syncs this .exe to every client.
        # It relies on users having the .NET 10 runtime, which SPT 4.1 itself requires:
        # SPT.Server.runtimeconfig.json asks for Microsoft.NETCore.App 10.0.0. That's why the
        # Updater must stay on the same major as SPT — .NET does not roll forward across
        # majors, so a net9 build would refuse to start on a clean 4.1 install.
        run: dotnet publish ModSync.Updater/ModSync.Updater.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true --no-restore --nologo

      - name: Stage release artifacts
        # Builds the directory tree users extract into their SPT install:
        #   <game>/BepInEx/plugins/Corter-ModSync/Corter-ModSync.dll              (BepInEx client plugin)
        #   <game>/BepInEx/plugins/Corter-ModSync/Corter-ModSync.dll.config       (binding redirects)
        #   <game>/BepInEx/patchers/Corter-ModSync-Prepatch.dll                      (preloader patcher)
        #   <game>/SPT_Runtime/user/mods/Corter-ModSync/ModSync.Server.dll        (server mod)
        #   <game>/ModSync.Updater.exe                                             (single-file updater)
        #
        # SPT 4.1 renamed the server folder from SPT/ to SPT_Runtime/ (confirmed by the 4.1.1
        # release archive's top-level folder and SPTInstaller's SetupClientTask). user/mods/
        # inside it is unchanged. The client-side paths (BepInEx/, the Updater at the game
        # root) are unaffected by the rename.
        #
        # NOTE: config.jsonc is deliberately NOT shipped. The server writes it on first boot
        # if it's missing, so bundling it bought nothing but the risk of an admin unzipping an
        # update over their customised config and losing their syncPaths/headlessIncludes.
        # A reference copy of the current defaults is written to config_default.jsonc on every
        # boot, so admins can still see what changed without their live config being touched.
        # User unzips into their game root and the right files end up in the right places.
        # BepInEx scans plugins/ and patchers/ recursively, so subfolder layouts work seamlessly.
        shell: pwsh
        run: |
          $stage = "release-stage"
          New-Item -ItemType Directory -Force -Path "$stage/BepInEx/plugins/Corter-ModSync"  | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/BepInEx/patchers"               | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/SPT_Runtime/user/mods/Corter-ModSync"    | Out-Null

          # Client plugin (bundled into its own subfolder)
          Copy-Item "ModSync/bin/Release/net472/Corter-ModSync.dll"        "$stage/BepInEx/plugins/Corter-ModSync/"
          Copy-Item "ModSync/bin/Release/net472/Corter-ModSync.dll.config" "$stage/BepInEx/plugins/Corter-ModSync/"

          # Preloader patcher — applies PendingUpdates before plugin DLLs are loaded
          Copy-Item "ModSync.Patcher/bin/Release/net472/Corter-ModSync-Prepatch.dll" "$stage/BepInEx/patchers/"

          # Server mod + default config (bundled so admins can edit before first run)
          Copy-Item "ModSync.Server/bin/Release/ModSync.Server/ModSync.Server.dll" "$stage/SPT_Runtime/user/mods/Corter-ModSync/"
          # (config.jsonc intentionally not staged — see the layout note above)

          # Updater — single-file output from the publish step above. Just the .exe
          # (~1.6MB) with Newtonsoft.Json, deps.json, and runtimeconfig.json all bundled in.
          Copy-Item "ModSync.Updater/bin/Release/net10.0-windows/win-x64/publish/ModSync.Updater.exe" "$stage/"

      - name: Create zip
        shell: pwsh
        run: |
          $zip = "Corter-ModSync-${{ github.ref_name }}.zip"
          Compress-Archive -Path "release-stage/*" -DestinationPath $zip -Force
          # Log the layout so the workflow run page shows what got packaged.
          Write-Host "=== Zip contents ==="
          [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries | ForEach-Object { Write-Host $_.FullName }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "Corter-ModSync-${{ github.ref_name }}.zip"
          # Tags containing "-pre" (e.g. v0.11.1-pre1) are marked as pre-release on
          # GitHub — they don't show up in the "Latest" link, and users get a warning.
          prerelease: ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-rc') }}
          # Auto-generate changelog from PR/commit history between this tag and the previous one.
          generate_release_notes: true
          # !!! UPDATE THE BODY BELOW BEFORE TAGGING A NEW RELEASE !!!
          # This text is baked into every release page verbatim — a stale body means the
          # release ships with the PREVIOUS version's changelog (happened on v0.12.4).
          body: |
            ## Changes

            - **New: `baseFiles` — sync mods that replace base-game files.** A syncPath can now list base-game files the mod overwrites (e.g. DLSS's `nvngx_dlss.dll`, DynamicMaps' Unity assemblies). ModSync backs the original up as `.modsync-bak` before replacing it and restores it when the mod is removed, so opting out puts the game back exactly as it was. This replaces the hardcoded DynamicMaps handling with a general mechanism any mod can use.
            - **New: `headless` per syncPath** — set `"headless": false` and that path is never offered to a headless client. Useful for anything graphical (DLSS, map overlays), which a headless renders nothing for and simply wastes disk and bandwidth on.
            - **New: ModSync updates itself first, then restarts.** When the client's version doesn't match the server's, the server serves only ModSync's own components until the client is current. This removes a class of failures where an out-of-date client tried to interpret a newer server's response.
            - **New: `config_default.jsonc`** — the server writes the current shipped defaults alongside your config on every boot, so you can diff new options in without your own file ever being touched.
            - **New: notification for missing config options** — if a release adds a top-level option your config lacks, the server logs it once at startup. It never rewrites your file.
            - **Rework: the F12 menu.** Optional mods get a real checkbox that installs and uninstalls them. Enforced and built-in paths are now *shown* rather than hidden — as a one-line explanation with no control, so you can see what the server manages without being able to break it. The three catch-all paths are hidden entirely.
            - **The zip no longer ships `config.jsonc`.** The server writes it on first boot if missing, so extracting over an existing install can no longer clobber your config.

            ## Upgrade notes

            Unzip into your game root as usual — clients update via sync, no manual steps.

            Your existing `config.jsonc` is untouched: `baseFiles` and `headless` are optional and default to the previous behaviour. To use them, copy the examples from the regenerated `config_default.jsonc`.

            Upgrading leaves one dead entry, `(Builtin) Managed Files`, in each client's `BepInEx/config/corter.modsync.cfg`. It is unbound and does nothing; delete the line if it bothers you.

            ## Docs

            - [Mods that replace base-game files](https://github.com/Dildz/ModSync-for-SPT4.0/wiki/Configuration#mods-that-replace-base-game-files) — how `baseFiles` backs up and restores originals, and why a hand-installed mod gets locked
            - [Usage Examples](https://github.com/Dildz/ModSync-for-SPT4.0/wiki/UsageExamples) — worked `config.jsonc` setups, from minimal to a real server

            **Coming from before v0.12.4?** See the v0.12.4 notes for the one-time `BepInEx/patchers/Corter-ModSync/` folder cleanup on the server/headless.
